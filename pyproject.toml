[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raspi-monita"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.24.0,<3",
    "piper-tts>=1.8.0,<2",
    "platformdirs>=4,<5",
    "pyopenjtalk>=0.4.1,<1",
    "pyyaml>=6.0.3,<7"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

